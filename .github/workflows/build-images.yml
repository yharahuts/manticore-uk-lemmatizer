name: Build docker images

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: 

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # todo: automatically create matrix versions from github repository tags
        version: [ '6.3.0', '13.11.0', 'latest', 'dev' ]
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_TAG=${{ matrix.version }}
          tags: ${{ vars.DOCKERHUB_IMAGE }}:${{ matrix.version }}